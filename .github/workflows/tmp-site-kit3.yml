# Temporary verification for the SvelteKit 3 site migration; removed before merge.
name: tmp-site-kit3
on:
  push:
    branches: [build/site-kit3]
permissions:
  contents: read
jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Regenerate site/pnpm-lock.yaml
        working-directory: site
        run: |
          pnpm --version
          pnpm install --lockfile-only --ignore-workspace
          git diff --stat -- pnpm-lock.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: site-lockfile
          path: site/pnpm-lock.yaml
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: after
      - uses: actions/checkout@v7
        with:
          ref: main
          path: before
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: after/package.json
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
      - name: Build both sites
        run: |
          (cd before/site && pnpm install --frozen-lockfile --ignore-workspace && pnpm build)
          (cd after/site && pnpm install --ignore-workspace && pnpm build)
      - name: Type check (svelte-check) on both
        run: |
          set +e
          (cd before/site && pnpm check > "$RUNNER_TEMP/check-before.txt" 2>&1; echo "before exit $?")
          (cd after/site && NO_COLOR=1 pnpm check --output human > "$RUNNER_TEMP/check-after.txt" 2>&1; echo "after exit $?")
          tail -5 "$RUNNER_TEMP/check-before.txt"; echo ---; grep -E '^(Error|Warn)' "$RUNNER_TEMP/check-after.txt" | sort | uniq -c | sort -rn | head -20; tail -3 "$RUNNER_TEMP/check-after.txt"
      - name: Serve both builds under the Pages base path
        run: |
          for v in before:8001 after:8002; do
            name=${v%%:*}; port=${v##*:}
            mkdir -p "$RUNNER_TEMP/serve-$name" && ln -s "$PWD/$name/site/build" "$RUNNER_TEMP/serve-$name/eslint-plugin-postgresql"
            (cd "$RUNNER_TEMP/serve-$name" && python3 -m http.server "$port" --bind 127.0.0.1 >/dev/null 2>&1 &)
          done
          sleep 2
      - name: Capture and compare
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y >/dev/null && npm install playwright@1.63.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cp "$GITHUB_WORKSPACE/after/.github/tmp-site/shots.mjs" . && node shots.mjs "$RUNNER_TEMP/shots"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: site-shots
          path: |
            ${{ runner.temp }}/shots
            ${{ runner.temp }}/check-*.txt
