# Temporary, not for merge: packs this branch's plugin (no publish) and
# installs it fresh with npm, pnpm and yarn on Node 22 and 24, next to ESLint
# 10, then lints SQL and a Prisma file through the installed package.
name: tmp-plugin-consumer
on:
  push:
    branches: [verify/plugin-consumer-7c2d5c2]
permissions:
  contents: read
jobs:
  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: |
          pnpm install --frozen-lockfile
          pnpm build
          mkdir -p "$RUNNER_TEMP/pack" && npm pack --pack-destination "$RUNNER_TEMP/pack"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-packed
          path: ${{ runner.temp }}/pack/*.tgz
  fresh-consumer:
    needs: pack
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pm: [npm, pnpm, yarn]
        node: [22, 24]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v7
        with:
          name: plugin-packed
          path: ${{ runner.temp }}/pack
      - name: Fresh install of the packed plugin
        working-directory: ${{ runner.temp }}
        run: |
          tgz=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          mkdir app && cd app && echo '{"name":"app","private":true,"type":"module"}' > package.json
          case "${{ matrix.pm }}" in
            npm) npm install eslint@10 "$tgz" ;;
            pnpm) npx -y pnpm@12.9.1 add eslint@10 "$tgz" --config.strict-dep-builds=false ;;
            # Yarn 4 quarantines versions published only recently (YN0016), which
            # includes postgresql-eslint-parser 0.6.0 today. Pre-approve that one
            # package in this throwaway app so the check can run.
            yarn) corepack enable && yarn set version stable && printf 'nodeLinker: node-modules\nnpmPreapprovedPackages:\n  - postgresql-eslint-parser\n' >> .yarnrc.yml && cp "$tgz" plugin.tgz && yarn add eslint@10 ./plugin.tgz ;;
          esac
      - name: npm audit signatures
        if: matrix.pm == 'npm'
        working-directory: ${{ runner.temp }}/app
        run: |
          npm ls postgresql-eslint-parser @libpg-query/parser
          npm audit signatures 2>&1 | tee "$RUNNER_TEMP/audit-signatures.txt"
      - uses: actions/upload-artifact@v7
        if: matrix.pm == 'npm'
        with:
          name: audit-signatures-node${{ matrix.node }}
          path: ${{ runner.temp }}/audit-signatures.txt
      - name: Import and lint
        working-directory: ${{ runner.temp }}/app
        run: cp "$GITHUB_WORKSPACE/.github/tmp-consumer/check.mjs" . && node check.mjs
