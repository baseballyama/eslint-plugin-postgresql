# Temporary (removed before merge): regenerates lockfiles on a CI runner and
# compares this branch's build with the published 0.24.0.
name: Temporary verification

on: pull_request

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: pnpm install --lockfile-only --no-frozen-lockfile
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-workspace
        working-directory: site
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lockfiles
          path: |
            pnpm-lock.yaml
            site/pnpm-lock.yaml

  compare-0-24-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Pack both versions
        run: |
          mkdir -p .cmp/base .cmp/head
          (cd .cmp/base && npm pack eslint-plugin-postgresql@0.24.0 --silent && tar xzf ./*.tgz)
          npm pack --silent --pack-destination .cmp/head && (cd .cmp/head && tar xzf ./*.tgz)
          {
            echo "### Tarball contents (0.24.0 → this build)"
            echo '```diff'
            diff -u <(cd .cmp/base/package && find . -type f | sort) <(cd .cmp/head/package && find . -type f | sort) || true
            echo '```'
            echo "### Type declarations (dist/index.d.ts)"
            echo '```diff'
            diff -u .cmp/base/package/dist/index.d.ts .cmp/head/package/dist/index.d.ts || true
            echo '```'
            echo "### Sizes (bytes)"
            echo '```'
            (cd .cmp/base/package && find dist -type f -exec wc -c {} + | sort -k2) | sed 's/^/0.24.0 /'
            (cd .cmp/head/package && find dist -type f -exec wc -c {} + | sort -k2) | sed 's/^/head   /'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: node .github/tmp-compare/compare.mjs "$PWD/.cmp/base/package" "$PWD/.cmp/head/package"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: packages
          path: .cmp/*/*.tgz
