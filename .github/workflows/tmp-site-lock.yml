# Temporary, not for merge: regenerates site/pnpm-lock.yaml on a runner and
# type-checks and builds the site with it.
name: tmp-site-lock
on:
  push:
    branches: [build/types-node-26]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - run: pnpm install --no-frozen-lockfile --ignore-workspace && pnpm dedupe --ignore-workspace && git diff --stat -- pnpm-lock.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: site-lockfile
          path: site/pnpm-lock.yaml
      - run: pnpm run check
      - run: pnpm build
