# Temporary, not for merge: moves the auto-installed eslint peer in the root
# lockfile to the latest release and runs the quality gate and tests with it.
name: tmp-eslint-lock
on:
  push:
    branches: [verify/plugin-eslint-10-12-5af99d7]
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Update eslint in the lockfile
        run: |
          npm view eslint version
          pnpm install --frozen-lockfile
          pnpm update eslint
          pnpm dedupe
          git diff --stat
          git diff -- package.json
          grep -E "^  eslint@" pnpm-lock.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: eslint-lockfile
          path: |
            pnpm-lock.yaml
            package.json
      - name: Quality gate
        run: pnpm check:all
      - name: Tests
        run: pnpm test
