# Temporary, not for merge: verifies PR #284 head 5251eab (main merged into
# build/eslint-10-12). Runs the real formatter and checks the lockfile.
name: tmp-pg284-verify
on:
  push:
    branches: [verify/pg284-format-5251eab]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format:check
      - name: Format write
        if: always()
        run: pnpm format:fix
      - name: Diff after format write
        if: always()
        run: |
          git status --porcelain
          git diff --stat
          git diff --exit-code
          test -z "$(git status --porcelain)"
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Frozen install
        run: pnpm install --frozen-lockfile
      - name: Installed versions
        run: |
          pnpm --version
          pnpm list eslint postgresql-eslint-parser --depth 0
          grep -E "^  (eslint|postgresql-eslint-parser)@" pnpm-lock.yaml
      - name: Dedupe check
        if: always()
        run: pnpm dedupe --check
      - name: Lockfile-only re-resolve is a no-op
        if: always()
        run: |
          pnpm install --lockfile-only
          git diff --stat
          git diff --exit-code
