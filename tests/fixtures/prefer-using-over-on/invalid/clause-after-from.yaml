output: |-
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active GROUP BY o.id;
  SELECT 1 FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active HAVING count(*) > 1;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active WINDOW w AS (ORDER BY o.id);
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active ORDER BY o.id;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active LIMIT 1;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active OFFSET 1;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active FETCH FIRST 1 ROW ONLY;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active FOR UPDATE;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active UNION SELECT id FROM archived_orders;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active INTERSECT SELECT id FROM archived_orders;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active EXCEPT SELECT id FROM archived_orders;
  UPDATE invoices SET paid = TRUE FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active RETURNING invoices.id;
  INSERT INTO paid_orders SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active ON CONFLICT DO NOTHING;
  CREATE TABLE active_orders AS SELECT o.id FROM orders o JOIN customers c USING (customer_id), regions r WHERE c.active WITH NO DATA;
  SELECT o.id FROM orders o JOIN customers c USING (customer_id), unnest(o.tags) WITH ORDINALITY t (tag, n) WHERE c.active;
