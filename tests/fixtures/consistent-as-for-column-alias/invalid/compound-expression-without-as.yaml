errors:
  - messageId: preferAs
    message: Use `AS` before the column alias `total`.
    line: 7
    column: 12
    endLine: 7
    endColumn: 17
  - messageId: preferAs
    message: Use `AS` before the column alias `user_id`.
    line: 8
    column: 6
    endLine: 8
    endColumn: 13
output: |-
  -- When the alias is omitted on a TypeCast value the rule's old logic
  -- would have corrupted `()::ulid id` into `()::AS ulid id` (parser range
  -- ends mid-cast). The rule steps over the tokens no range covers (here
  -- `COUNT`'s `(*)`) and requires the next token to match the alias name
  -- before inserting `AS`.
  SELECT
    COUNT(*) AS total,
    id AS user_id
  FROM users;
