output: |-
  SELECT
    u.id user_id,
    count(*) total,
    extract(epoch FROM u.expires_at) * 1000 expires_ms,
    CAST(u.created_at AS date) created_on,
    CASE WHEN u.active THEN 'a' ELSE 'b' END status,
    u.tags[1] first_tag,
    row_number() OVER (ORDER BY u.id) row_num,
    (SELECT max(o.id) max_id FROM orders o) last_order_id
  FROM users u;
